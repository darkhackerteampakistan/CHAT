<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Chating</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
            }
        }
    </script>
</head>
<body>
    <!-- Login/Signup Container -->
    <div id="auth-container">
        <div class="auth-card">
            <h2>TNC CHAT</h2>
            <div class="auth-tabs">
                <button id="login-tab" class="active">Login</button>
                <button id="signup-tab">Sign Up</button>
            </div>

            <form id="login-form" class="auth-form active">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
                <div class="error" id="login-error"></div>
            </form>

            <form id="signup-form" class="auth-form">
                <input type="text" id="signup-name" placeholder="Your Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password (min 6)" required>
                <button type="submit">Create Account</button>
                <div class="error" id="signup-error"></div>
            </form>
        </div>
    </div>

    <!-- Main Chat UI (hidden until login) -->
    <div id="chat-app" class="chat-app hidden">
        <div class="chat-header">
            <h2>💬 HACKER CHAT</h2>
            <div>
                <span id="username-display"></span>
                <button id="logout-btn" class="logout-icon">🚪</button>
            </div>
        </div>

        <div class="messages-area" id="messages-area">
            <div id="messages-list" class="messages-list">
                <div class="empty-msg">✨ No messages yet. Say something!</div>
            </div>
        </div>

        <div class="input-area">
            <button id="emoji-btn" class="emoji-btn">😊</button>
            <div id="emoji-picker" class="emoji-picker hidden">
                <span>😀</span><span>😂</span><span>🥰</span><span>😎</span><span>🤔</span>
                <span>👍</span><span>❤️</span><span>🔥</span><span>🎉</span><span>✨</span>
            </div>
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn" class="send-btn">📤</button>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
